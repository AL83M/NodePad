name: Build NodePad v3 Development

on:
  push:
    branches: ["dev/v3.0"]
    paths: ["firmware/NodePad_V2_8_Beta/**", ".github/workflows/build-beta-28.yml"]
  pull_request:
    paths: ["firmware/NodePad_V2_8_Beta/**", ".github/workflows/build-beta-28.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install toolchain and dependencies
        env:
          ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install esp32:esp32@3.3.7 --additional-urls "$ESP32_INDEX"
          arduino-cli lib update-index
          arduino-cli lib install "M5Cardputer@1.1.1"
          arduino-cli lib install "NimBLE-Arduino@2.3.9"
      - name: Build v3.0 development image for original Cardputer
        run: |
          set -euo pipefail
          arduino-cli compile \
            --fqbn "esp32:esp32:m5stack_cardputer:CDCOnBoot=cdc,USBMode=hwcdc,FlashSize=8M,PartitionScheme=default_8MB" \
            --output-dir build-beta \
            firmware/NodePad_V2_8_Beta
      - name: Package binaries
        run: |
          set -euo pipefail
          mkdir -p dist-v3
          cp build-beta/NodePad_V2_8_Beta.ino.bin dist-v3/NodePad_v3_dev_app_0x10000.bin
          if test -s build-beta/NodePad_V2_8_Beta.ino.merged.bin; then
            cp build-beta/NodePad_V2_8_Beta.ino.merged.bin dist-v3/NodePad_v3_dev_factory_0x0000.bin
          fi
          sha256sum dist-v3/* > dist-v3/SHA256SUMS.txt
      - name: Upload beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: NodePad-v3-DEV-Cardputer
          path: dist-v3/
          if-no-files-found: error
