name: Build NodePad v2.8 Beta

on:
  push:
    branches: ["beta/v2.8-cardputer-adv-web-credits"]
    paths: ["firmware/NodePad_V2_8_Beta/**", ".github/workflows/build-beta-28.yml"]
  pull_request:
    paths: ["firmware/NodePad_V2_8_Beta/**", ".github/workflows/build-beta-28.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install toolchain and dependencies
        env:
          ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install esp32:esp32@3.3.7 --additional-urls "$ESP32_INDEX"
          arduino-cli lib update-index
          arduino-cli lib install "M5Cardputer@1.2.0" "NimBLE-Arduino@2.3.9"
      - name: Build one ESP32-S3 image for Cardputer and ADV testing
        run: |
          set -euo pipefail
          arduino-cli compile \
            --fqbn "esp32:esp32:m5stack_cardputer:CDCOnBoot=cdc,USBMode=hwcdc,FlashSize=8M,PartitionScheme=default_8MB" \
            --output-dir build-beta \
            firmware/NodePad_V2_8_Beta
      - name: Package binaries
        run: |
          set -euo pipefail
          mkdir -p dist-beta
          cp build-beta/NodePad_V2_8_Beta.ino.bin dist-beta/NodePad_v2.8_beta_app_0x10000.bin
          if test -s build-beta/NodePad_V2_8_Beta.ino.merged.bin; then
            cp build-beta/NodePad_V2_8_Beta.ino.merged.bin dist-beta/NodePad_v2.8_beta_factory_0x0000.bin
          fi
          sha256sum dist-beta/* > dist-beta/SHA256SUMS.txt
      - name: Upload beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: NodePad-v2.8-Beta-unified-ESP32S3
          path: dist-beta/
          if-no-files-found: error
